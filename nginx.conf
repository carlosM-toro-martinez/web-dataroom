server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /app/sw.js =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    add_header Content-Type application/manifest+json;
    try_files /app/manifest.webmanifest =404;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /app/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /app/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    try_files $uri $uri/ /app/index.html;
  }

  location = /404 {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    try_files /404.html =404;
  }

  location ~ ^/(dashboard|exploraciones|exploraciones-data-room|solicitudes-data-room|trabajadores|usuarios|login|forgot-password|reset-password)(/.*)?$ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    try_files /app/index.html =404;
  }

  location / {
    try_files $uri $uri/ /404.html;
  }
}
